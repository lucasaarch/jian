[package]
name = "jian-remote-cli"
version.workspace = true
edition.workspace = true
description = "Jian Remote: pairs a machine with its gateway, installs the worker as a service and runs it"
license.workspace = true
publish = false

[[bin]]
name = "jian-remote"
path = "src/main.rs"

[dependencies]
jian-computer-use = { path = "../../crates/jian-computer-use" }
jian-protocol = { path = "../../crates/jian-protocol" }
jian-remote = { path = "../../crates/jian-remote" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.15", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"
