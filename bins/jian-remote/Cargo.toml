[package]
name = "jian-remote-cli"
version.workspace = true
edition.workspace = true
description = "Jian Remote: pairs a machine with its gateway, installs the worker as a service and runs it"
license.workspace = true
publish = false

[[bin]]
name = "jian-remote"
path = "src/main.rs"
# Its docs would land on the path of the `jian-remote` library.
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
jian-computer-use.workspace = true
jian-remote.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "termios"] }

[lints]
workspace = true
