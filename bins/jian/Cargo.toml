[package]
name = "jian"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# What this build is: an edition, which is only a sum of capabilities (see `jian-server`'s
# features). The self-hosted one is the default. The desktop app is
# `--no-default-features --features local` (no public URL, so nothing that needs one compiles)
# and the Cloud `--no-default-features --features cloud` (no local process). Turning two on is
# their union, never a conflict.
default = ["self-hosted"]
local = ["jian-server/local"]
self-hosted = ["jian-server/self-hosted", "public-url"]
cloud = ["jian-server/cloud", "public-url"]
# The one capability this binary tests itself (to register the e-mail jobs, which need a link
# people can open); the editions that have it turn it on beside `jian-server`'s.
public-url = ["jian-server/public-url"]

[dependencies]
axum.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-browser.workspace = true
jian-exec.workspace = true
jian-channel-api.workspace = true
jian-channel-whatsapp.workspace = true
jian-import.workspace = true
jian-mail.workspace = true
jian-server.workspace = true
jian-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jian-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
