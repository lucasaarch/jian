[package]
name = "jian"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# What this build is: an edition, which is only a sum of capabilities (see `jian-server`'s
# features). The desktop app is `--no-default-features --features local`; the Cloud is
# `--no-default-features --features cloud`.
default = ["self-hosted"]
local = ["jian-server/local", "mcp-http", "mcp-stdio"]
self-hosted = [
    "jian-server/self-hosted",
    "mcp-http",
    "mcp-stdio",
    "channels",
    "multi-user",
    "public-artifacts",
    "email-login",
    "email-invitations",
    "github-login",
    "github-app",
    "linear-webhooks",
    "channel-webhooks",
    "slack-events-api",
]
cloud = [
    "jian-server/cloud",
    "mcp-http",
    "channels",
    "multi-user",
    "public-artifacts",
    "email-login",
    "email-invitations",
    "github-login",
    "github-app",
    "linear-webhooks",
    "channel-webhooks",
    "slack-events-api",
]
email-login = ["jian-server/email-login"]
email-invitations = ["jian-server/email-invitations", "multi-user"]
multi-user = ["jian-server/multi-user"]
public-artifacts = ["jian-server/public-artifacts"]
github-login = ["jian-server/github-login"]
github-app = ["jian-server/github-app"]
linear-webhooks = ["jian-server/linear-webhooks"]
channel-webhooks = ["jian-server/channel-webhooks"]
slack-events-api = ["jian-server/slack-events-api"]
channels = [
    "jian-server/channels",
    "dep:jian-channel-discord",
    "dep:jian-channel-slack",
    "dep:jian-channel-telegram",
    "dep:jian-channel-whatsapp",
]
mcp-http = ["jian-server/mcp-http"]
mcp-stdio = ["jian-server/mcp-stdio"]

[dependencies]
axum.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-browser.workspace = true
jian-exec.workspace = true
jian-channel-api.workspace = true
jian-channel-discord = { workspace = true, optional = true }
jian-channel-slack = { workspace = true, optional = true }
jian-channel-telegram = { workspace = true, optional = true }
jian-channel-whatsapp = { workspace = true, optional = true }
jian-import.workspace = true
jian-mail.workspace = true
jian-server.workspace = true
jian-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jian-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
