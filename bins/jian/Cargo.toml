[package]
name = "jian"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# What this build is. The self-hosted one is the default; a Cloud build is
# `--no-default-features --features cloud`, and leaves out every plugin that may only run where
# the operator owns the machine.
default = ["self-hosted"]
self-hosted = ["jian-server/self-hosted"]
cloud = ["jian-server/cloud"]

[dependencies]
axum.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-exec.workspace = true
jian-import.workspace = true
jian-mail.workspace = true
jian-server.workspace = true
jian-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jian-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
