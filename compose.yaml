# Production stack: the panel's web server, the gateway behind it, and PostgreSQL behind both.
# `make up` starts it.
# For the development database alone, see compose.dev.yaml.
# Compose would otherwise name the project after the checkout directory, so the container
# and volume names would follow whatever the clone is called.
name: jian
services:
  # The only service with a published port. It serves the panel and passes /v1 and /health on
  # to the gateway, so the browser, webhooks and remote workers all keep one address.
  web:
    image: ghcr.io/lucasaarch/jian-web:${JIAN_VERSION:-latest}
    # To run your own build, uncomment this as well as the gateway's.
    # build:
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    environment:
      JIAN_GATEWAY_URL: http://gateway:4310
    ports:
      # Localhost by default: anything wider belongs behind an HTTPS proxy. The host port is
      # the one the gateway used to publish, so addresses handed out before keep working.
      - '${JIAN_BIND_ADDRESS:-127.0.0.1}:${JIAN_BIND_PORT:-4310}:3000'
    depends_on:
      gateway:
        condition: service_healthy
    # The health check comes from the image's own HEALTHCHECK, which hits /web/health.
    restart: unless-stopped
  gateway:
    image: ghcr.io/lucasaarch/jian-gateway:${JIAN_VERSION:-latest}
    # To run your own build instead of the published image, uncomment this and use
    # `docker compose up -d --build`. The image line above stays, naming the local build.
    # build:
    #   context: .
    #   dockerfile: apps/gateway/Dockerfile
    environment:
      # The database is reached over the compose network, never from the host, so this
      # ignores the DATABASE_URL that `make setup` wrote for local development.
      DATABASE_URL: postgres://jian:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/jian
      JIAN_API_TOKEN: ${JIAN_API_TOKEN:?Run make setup first}
      JIAN_ACTIVE_KEY_ID: ${JIAN_ACTIVE_KEY_ID:?Run make setup first}
      JIAN_MASTER_KEYS: ${JIAN_MASTER_KEYS:?Run make setup first}
      JIAN_ROLE: ${JIAN_ROLE:-all}
      JIAN_TIME_ZONE: ${JIAN_TIME_ZONE:-}
      JIAN_ALLOW_PRIVATE_ORIGINS: ${JIAN_ALLOW_PRIVATE_ORIGINS:-}
      # Opt in to the bundled record-only listener; override URL for an external proxy.
      JIAN_CAVEMAN_ENABLED: ${JIAN_CAVEMAN_ENABLED:-false}
      JIAN_CAVEMAN_PROXY_URL: ${JIAN_CAVEMAN_PROXY_URL:-http://127.0.0.1:8788}
      # Only the web service reaches the gateway, over the Compose network, so the forwarded
      # client address and scheme it sends are believed from private addresses only.
      JIAN_TRUSTED_PROXIES: ${JIAN_TRUSTED_PROXIES:-uniquelocal}
      # Bound inside the container, with no published port: the web service is the way in.
      HOST: 0.0.0.0
      PORT: 4310
    depends_on:
      postgres:
        condition: service_healthy
    # What the agent installs as the `node` user, its SSH keys and its Git and gh logins live
    # here and survive an image update.
    volumes:
      - gateway_home:/home/node
    # The health check comes from the image's own HEALTHCHECK, which hits /health.
    restart: unless-stopped
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: jian
      POSTGRES_USER: jian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    # No published port: the database is reachable only from the gateway.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jian -d jian']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  gateway_home:
