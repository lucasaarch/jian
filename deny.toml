# cargo-deny: what the Rust workspace may depend on. Run with `cargo deny check`.

[graph]
# The OS families the product ships for; a dependency only one of them uses still counts.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# A known vulnerability is a warning for now, not a build failure, until CI runs this.
yanked = "warn"
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "IJG",
  "CDLA-Permissive-2.0",
  # mailparse and quoted_printable, which resend-rs uses: a public-domain-like license with no
  # conditions at all.
  "0BSD",
  # postgresql_embedded and its siblings: "(Apache-2.0 OR MIT) AND PostgreSQL". The PostgreSQL
  # license is a short permissive one, like MIT, and covers the bundled server too.
  "PostgreSQL",
]
confidence-threshold = 0.9

[bans]
# Two versions of a crate cost build time and size; worth seeing, not worth failing on.
multiple-versions = "warn"
# Workspace crates depend on each other by path, which has no version to pin.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
