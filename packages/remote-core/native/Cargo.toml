[package]
name = "jian-computer-helper"
version = "0.1.0"
edition = "2024"
description = "Jian Remote's Computer Use helper: screenshots and input, spoken to as JSON lines"
license = "Apache-2.0"
publish = false

[[bin]]
name = "computer-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
jpeg-encoder = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColor"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSScreen", "NSImage", "NSColor", "NSGraphics", "NSRunningApplication", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDate", "NSRunLoop", "NSGeometry", "NSString", "NSValue", "NSObjCRuntime"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAAnimation", "CAMediaTiming", "CATransaction", "CAMediaTimingFunction", "objc2-core-foundation", "objc2-core-graphics"] }

# Pure Rust, no libxcb or libX11: the binary links statically against musl and runs on any distro.
[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18.1"
x11rb = { version = "0.14.0", features = ["dpms", "shape", "xfixes", "xtest"] }

# Raw Win32 bindings, linked through raw-dylib: no import libraries and no COM wrappers to carry.
[target.'cfg(windows)'.dependencies]
png = "0.18.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
