[package]
name = "jian-computer-helper"
version = "0.1.0"
edition = "2024"
description = "Jian Remote's Computer Use helper: screenshots and input, spoken to as JSON lines"
license = "Apache-2.0"
publish = false

[[bin]]
name = "computer-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
jpeg-encoder = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
