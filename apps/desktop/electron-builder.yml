# Packages the app for macOS, Windows and Linux. Everything the app runs is bundled into out/ by
# electron-vite, so no node_modules ship and nothing native is rebuilt.
appId: com.jian.desktop
productName: Jian
copyright: Copyright © Jian contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ['*.png']
npmRebuild: false
# Every file names its CPU, x64 included: Publish merges one OS's CPUs into one update file, and
# electron-updater downloads the file whose name carries this machine's arch.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Always latest*.yml, a candidate's too, so a release has one set of update files to look for;
# GitHub keeps candidates as prereleases, which an installed stable release never sees.
detectUpdateChannel: false
# The local gateway, compiled with its production dependencies (scripts/stage-gateway.mjs).
afterPack: scripts/after-pack.mjs
asar: true
# jian:// links open the app: the local gateway's pages after a GitHub sign-in link back with one.
protocols:
  - name: Jian
    schemes: [jian]

mac:
  # macOS takes a single category; Linux lists it under developer tools as well.
  category: public.app-category.productivity
  # One download per CPU, packaged on a machine of that CPU: the local gateway's native
  # dependencies are installed for the machine that packages it. So no target names an arch;
  # `--arm64`/`--x64`, or this machine's, decides. The zip is what an installed app updates from.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # The Computer Use helper for this computer's machine on the gateways: one universal binary,
  # as packages/remote-core/native/build-macos.sh writes it. Signed with the app.
  extraResources:
    - from: ../../packages/remote-core/native/bin/macos
      to: computer-helpers/macos
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarized when Publish has the App Store Connect key (APPLE_API_KEY, _ID, _ISSUER).
  notarize: true

win:
  # One installer per CPU, each packaged on its own (see mac). It updates in place, from a
  # blockmap, downloading only the blocks that changed.
  target:
    - nsis
  # One helper per CPU (native/build-windows.sh); the worker picks this one's.
  extraResources:
    - from: ../../packages/remote-core/native/bin/windows
      to: computer-helpers/windows

nsis:
  oneClick: true
  perMachine: false

linux:
  # Menus list it with developer tools, and with utilities too.
  category: Development
  desktop:
    entry:
      Categories: Development;Utility;
  # The AppImage updates itself in place. The .deb is the system's package manager's to update;
  # an app installed from it says a release is out and links to it.
  target:
    - AppImage
    - deb
  maintainer: Jian contributors
  # One helper per CPU (native/build-linux.sh); the worker picks this one's.
  extraResources:
    - from: ../../packages/remote-core/native/bin/linux
      to: computer-helpers/linux

# Releases are the repository's own GitHub releases, where electron-updater looks for new ones.
# Packaging never publishes (`--publish never`): Publish uploads every OS's files to the one
# release its tag creates, with the note in docs/releases, which the update files carry too.
publish:
  provider: github
  owner: lucasaarch
  repo: jian
  releaseType: release
