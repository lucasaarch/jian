# Packages the app for macOS, Windows and Linux. Everything the app runs is bundled into out/ by
# electron-vite, so no node_modules ship and nothing native is rebuilt.
appId: com.jian.desktop
productName: Jian
copyright: Copyright © Jian contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ['*.png']
npmRebuild: false
asar: true

mac:
  category: public.app-category.productivity
  # One download for Apple silicon and Intel Macs alike.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarized when Publish has the App Store Connect key (APPLE_API_KEY, _ID, _ISSUER).
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: true
  perMachine: false

linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: Jian contributors

# Releases are the repository's own GitHub releases, where electron-updater looks for new ones.
publish:
  provider: github
  owner: lucasaarch
  repo: jian
  releaseType: release
