# The Rust side of the repository: the native Computer Use helper, and the Rust core that will
# replace the Node gateway. The Node apps and packages stay untouched; pnpm never reads this file.
[workspace]
resolver = "3"
# `crates/*` would also match the folder that holds the plugin crates, which is not a crate, and
# Cargo fails on a match with no manifest: every crate there is named `jian-*`.
members = ["packages/remote-core/native", "crates/jian-*", "crates/plugins/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Every dependency version lives here; a crate says `name.workspace = true`, and adds only the
# features it needs. Internal crates are listed too, so a path is written once.
[workspace.dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
# Password hashing: argon2id, in a PHC string. `std` for the error traits, `zeroize` wipes the
# memory blocks. No `rand`: the salt comes from the OS random source the store already uses.
argon2 = { version = "0.5.3", default-features = false, features = ["password-hash", "std", "zeroize"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
directories = "6"
base64 = "0.23.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
# The OS random source, for nonces and data keys.
getrandom = "0.3"
globset = { version = "0.4", default-features = false }
jian-auth = { path = "crates/jian-auth" }
jian-browser = { path = "crates/jian-browser" }
jian-computer-use = { path = "crates/jian-computer-use" }
jian-core = { path = "crates/jian-core" }
jian-exec = { path = "crates/jian-exec" }
jian-import = { path = "crates/jian-import" }
jian-llm = { path = "crates/jian-llm" }
jian-mail = { path = "crates/jian-mail" }
jian-plugin-api = { path = "crates/plugins/jian-plugin-api" }
# `public-url` (the webhook) comes from `jian-server`'s capability of the same name.
jian-plugin-github = { path = "crates/plugins/jian-plugin-github", default-features = false }
# No default features: `jian-server`'s `local-process` capability turns the stdio transport on or
# leaves it off.
jian-plugin-mcp = { path = "crates/plugins/jian-plugin-mcp", default-features = false }
jian-protocol = { path = "crates/jian-protocol" }
jian-remote = { path = "crates/jian-remote" }
jian-runtime = { path = "crates/jian-runtime" }
# No default features: the edition is chosen by the binary (`bins/jian`'s features).
jian-server = { path = "crates/jian-server", default-features = false }
jian-skills = { path = "crates/jian-skills" }
jian-store = { path = "crates/jian-store" }
# Test fixtures only: a crate lists them under [dev-dependencies].
jian-plugin-echo = { path = "crates/plugins/jian-plugin-echo", default-features = false }
jian-testkit = { path = "crates/jian-testkit" }
# Calendar and time zone arithmetic for cron schedules (DST-aware). The tz database is bundled,
# so the next run never depends on the host's zoneinfo; no system or IO feature is on.
jiff = { version = "1", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
jpeg-encoder = "0.7.1"
# The Postgres the gateway embeds. `bundled` puts the archive in the binary at build time (from
# theseus-rs/postgresql-binaries, which is why CI passes GITHUB_TOKEN) so nothing is downloaded at
# boot; the major it bundles is pinned by POSTGRESQL_VERSION in .cargo/config.toml. rustls, not
# native-tls, so there is no OpenSSL to link.
postgresql_embedded = { version = "0.22", default-features = false, features = ["bundled", "tokio", "tls-rustls-ring"] }
regex = "1.11"
# RS256 for a GitHub App's JWT and HMAC for its webhooks. The provider rustls already uses, so no
# second crypto library (and no aws-lc) comes in.
ring = { version = "0.17", default-features = false, features = ["alloc"] }
# Safe wrappers over the Unix calls the worker and its CLI make (signals, uid, termios), so
# neither needs `unsafe`.
rustix = { version = "1", default-features = false, features = ["std"] }
# ring, not aws-lc: no cmake or Go to build it, and the same provider for every TLS client.
# `rustls-no-provider` is reqwest's rustls without a bundled provider (its `rustls` feature pulls
# aws-lc); each place that builds a Client installs ring first. 0.13 is the version the embedded
# Postgres and resend-rs already use, so one reqwest is compiled.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
# No default features: its default is native-tls (OpenSSL), and its `rustls-tls` is aws-lc.
resend-rs = { version = "0.38", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.15", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
# TypeScript types for the wire protocol, generated into packages/protocol (`make protocol-gen`).
# Default features only: `serde-compat` is what makes it read the serde attributes.
ts-rs = "12.0.1"
url = "2.5"
webpki-roots = "1.0"
# Wipes keys and secrets from memory when they drop.
zeroize = "1"
# The container of Office files (xlsx, docx and pptx are zips of XML). Deflate through flate2's
# zlib-rs; the defaults would add bzip2, zstd, xz and AES, none of which Office needs.
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Computer Use helper, per platform. The macOS set is the AppKit and Quartz bindings the pointer
# overlay and input need; the Linux one is pure Rust (no libxcb, no libX11) so the binary links
# statically against musl; the Windows one is raw bindings through raw-dylib, no COM wrappers.
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColor"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSScreen", "NSImage", "NSColor", "NSFont", "NSFontDescriptor", "NSGraphics", "NSRunningApplication", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDate", "NSRunLoop", "NSGeometry", "NSString", "NSValue", "NSObjCRuntime"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CATextLayer", "CAAnimation", "CAMediaTiming", "CATransaction", "CAMediaTimingFunction", "objc2-core-foundation", "objc2-core-graphics"] }
png = "0.18.1"
x11rb = { version = "0.14.0", features = ["dpms", "shape", "xfixes", "xtest"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The rules every crate in `crates/` and `bins/` is held to, through `[lints] workspace = true`.
# `make rust-check` runs clippy with `-D warnings`, so a warning here fails the build.
[workspace.lints.rust]
# Only jian-computer-use needs FFI; it carries its own table (see its Cargo.toml).
unsafe_code = "forbid"
# Every public item says what it is for.
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors are values: a library returns them, and only a test may unwrap one.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Output goes through the log or the caller; only a binary's user interface may print.
print_stdout = "deny"
print_stderr = "deny"
# Pedantic lints that are noise here, not rules:
# a `jian_remote::remote::Worker` style name is how this code reads at the call site.
module_name_repetitions = "allow"
# `#[must_use]` on every getter hides the few that matter.
must_use_candidate = "allow"
# The `# Errors` and `# Panics` sections repeat the error type's own docs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# A request handler is one `match` over every kind of request; splitting it hides the list.
too_many_lines = "allow"
# Wire formats and OS APIs mix integer widths; each cast that matters is checked where it is made.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The helper ships as one small binary per platform.
[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwind, not abort: the gateway serves many tenants in one process, and a panic in one tenant's
# job or socket must end that task only (see `jian_server::guard`). The helper binaries pay a
# little size for it.
