name: CI
# A branch push and its pull request are the same commit, so `push` covers only what has no
# pull request of its own.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: make test-display
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jian_test
          POSTGRES_USER: jian
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jian -d jian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jian:ci-only-password@localhost:5432/jian_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
      - run: docker build -f apps/gateway/Dockerfile -t jian:ci .
      - run: make image-test-display IMAGE=jian VERSION=ci
      - name: Check out pinned Lemon render fixture
        uses: actions/checkout@v4
        with:
          repository: lucasaarch/lemon
          ref: a5c716a263b67c0ce51ecb47e81251bf4439ec2e
          path: .lemon-smoke
          persist-credentials: false
      - name: Build and render the actual Lemon counter in the image
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/lemon-display"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/home/node/lemon \
            -v "$GITHUB_WORKSPACE/.lemon-smoke:/home/node/lemon" \
            -v "$GITHUB_WORKSPACE/apps/gateway/test-display.py:/usr/local/libexec/test-display.py:ro" \
            -v "$RUNNER_TEMP/lemon-display:/artifacts" \
            --entrypoint bash jian:ci -euo pipefail -c '
              cd "$HOME"
              cargo build --locked --example counter 2>&1 | tee /artifacts/build.log
              python3 /usr/local/libexec/test-display.py \
                --lemon "$HOME/target/debug/examples/counter" /artifacts \
                2>&1 | tee /artifacts/test.log
            '
      - name: Preserve Lemon render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemon-display
          path: ${{ runner.temp }}/lemon-display
          if-no-files-found: warn
