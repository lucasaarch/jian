name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
# A newer commit supersedes validation of an older commit on the same branch or pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      gateway: ${{ steps.plan.outputs.gateway }}
      web: ${{ steps.plan.outputs.web }}
      ui: ${{ steps.plan.outputs.ui }}
      desktop: ${{ steps.plan.outputs.desktop }}
      remote: ${{ steps.plan.outputs.remote }}
      rust: ${{ steps.plan.outputs.rust }}
      postgres: ${{ steps.plan.outputs.postgres }}
      triage: ${{ steps.plan.outputs.triage }}
      contracts: ${{ steps.plan.outputs.contracts }}
      display: ${{ steps.plan.outputs.display }}
      imageGateway: ${{ steps.plan.outputs.imageGateway }}
      imageWeb: ${{ steps.plan.outputs.imageWeb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/ci-plan.test.mjs
      # Include earlier changes that have not passed CI yet, even after superseded runs cancel.
      - id: baseline
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          base="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch="$BRANCH" -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')" || base=''
          if [[ "$base" =~ ^[a-f0-9]{40}$ ]]; then echo "base=$base" >> "$GITHUB_OUTPUT"; fi
      - id: plan
        env:
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.baseline.outputs.base }}
          CI_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PR: ${{ github.event_name == 'pull_request' }}
          CI_FULL: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: node .github/scripts/ci-plan.mjs
  triage:
    needs: changes
    if: needs.changes.outputs.triage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/issue-*.test.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm changelog:check
      - if: needs.changes.outputs.contracts == 'true'
        run: pnpm contracts:check
  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jian/contracts build
      - run: pnpm exec biome check apps/gateway packages/contracts --error-on-warnings
      - run: pnpm --filter @jian/gateway typecheck
      - run: pnpm --filter @jian/gateway test --shard=${{ matrix.shard }}
      - if: matrix.shard == '1/2'
        run: pnpm --filter @jian/gateway build
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jian/contracts build
      - run: pnpm --filter @jian/sdk build
      - run: pnpm exec biome check apps/web packages/ui packages/sdk --error-on-warnings
      - run: pnpm --filter @jian/ui typecheck
      - run: pnpm --filter @jian/web typecheck
      - run: pnpm --filter @jian/web knip
      - if: needs.changes.outputs.ui == 'true'
        run: |
          pnpm --filter @jian/ui knip
          pnpm --filter @jian/ui test
      - run: pnpm --filter @jian/web test
      - run: pnpm --filter @jian/web build
  remote:
    needs: changes
    if: needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jian/contracts build
      - run: pnpm exec biome check apps/remote-control packages/remote-core --error-on-warnings
      - run: pnpm --filter @jian/remote-core typecheck
      - run: pnpm --filter @jian-ai/remote-control typecheck
      - run: pnpm --filter @jian/remote-core test
      - run: pnpm --filter @jian-ai/remote-control test
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jian/contracts build
      - run: pnpm --filter @jian/sdk build
      - run: pnpm exec biome check apps/desktop --error-on-warnings
      - run: pnpm --filter @jian/desktop typecheck
      - run: pnpm --filter @jian/desktop test
      - run: pnpm --filter @jian/desktop build
      - run: pnpm --filter @jian/desktop stage:gateway
  # The Computer Use helper on each OS it runs on: a platform's code compiles, lints and tests
  # only on that platform.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jian_test
          POSTGRES_USER: jian
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jian -d jian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jian:ci-only-password@localhost:5432/jian_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
  display:
    needs: changes
    if: needs.changes.outputs.display == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-display
      - run: python3 -m py_compile apps/gateway/test-display.py
  image-gateway:
    needs: changes
    if: needs.changes.outputs.imageGateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/gateway/Dockerfile -t jian:ci .
      - run: make image-test-display IMAGE=jian VERSION=ci
  image-web:
    needs: changes
    if: needs.changes.outputs.imageWeb == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/web/Dockerfile -t jian-web:ci .
  # This name remains the branch rule's single required check, even when every area is skipped.
  check:
    if: always()
    needs: [changes, quality, gateway, web, remote, triage, desktop, rust, postgres, display, image-gateway, image-web]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every selected gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success') throw new Error('Change detection failed.');
          const areas = { quality: 'quality', gateway: 'gateway', web: 'web', remote: 'remote', triage: 'triage', desktop: 'desktop', rust: 'rust', postgres: 'postgres', display: 'display', 'image-gateway': 'imageGateway', 'image-web': 'imageWeb' };
          for (const [job, area] of Object.entries(areas)) {
            const selected = jobs.changes.outputs[area];
            if (!['true', 'false'].includes(selected)) throw new Error(`Missing selection for ${area}.`);
            const accepted = selected === 'true' ? ['success'] : ['success', 'skipped'];
            if (!accepted.includes(jobs[job].result)) throw new Error(`${job}: ${jobs[job].result}`);
          }
          NODE
