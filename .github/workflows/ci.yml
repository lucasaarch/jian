name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
# A newer commit supersedes validation of an older commit on the same branch or pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.plan.outputs.node }}
      gateway: ${{ steps.plan.outputs.gateway }}
      panel: ${{ steps.plan.outputs.panel }}
      desktop: ${{ steps.plan.outputs.desktop }}
      remote: ${{ steps.plan.outputs.remote }}
      rust: ${{ steps.plan.outputs.rust }}
      triage: ${{ steps.plan.outputs.triage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/ci-plan.test.mjs
      # Include earlier changes that have not passed CI yet, even after superseded runs cancel.
      - id: baseline
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          base="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch="$BRANCH" -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')" || base=''
          if [[ "$base" =~ ^[a-f0-9]{40}$ ]]; then echo "base=$base" >> "$GITHUB_OUTPUT"; fi
      - id: plan
        env:
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.baseline.outputs.base }}
          CI_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PR: ${{ github.event_name == 'pull_request' }}
          CI_FULL: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: node .github/scripts/ci-plan.mjs
  triage:
    needs: changes
    if: needs.changes.outputs.triage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/issue-*.test.mjs
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm changelog:check
      - if: needs.changes.outputs.gateway == 'true'
        run: |
          pnpm --filter @jian/gateway test
          pnpm --filter @jian/gateway build
          make test-display
      - if: needs.changes.outputs.panel == 'true'
        run: |
          pnpm --filter @jian/ui knip
          pnpm --filter @jian/web knip
          pnpm --filter @jian/ui test
          pnpm --filter @jian/web test
          pnpm --filter @jian/web build
      - if: needs.changes.outputs.remote == 'true'
        run: |
          pnpm --filter @jian/remote-core test
          pnpm --filter @jian-ai/remote-control test
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jian/contracts build
      - run: pnpm --filter @jian/sdk build
      - run: pnpm --filter @jian/desktop typecheck
      - run: pnpm --filter @jian/desktop test
      - run: pnpm --filter @jian/desktop build
      - run: pnpm --filter @jian/desktop stage:gateway
  # The Computer Use helper on each OS it runs on: a platform's code compiles, lints and tests
  # only on that platform.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  postgres:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jian_test
          POSTGRES_USER: jian
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jian -d jian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jian:ci-only-password@localhost:5432/jian_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
      - run: docker build -f apps/gateway/Dockerfile -t jian:ci .
      - run: make image-test-display IMAGE=jian VERSION=ci
      - name: Check out pinned Lemon render fixture
        uses: actions/checkout@v4
        with:
          repository: lucasaarch/lemon
          ref: a5c716a263b67c0ce51ecb47e81251bf4439ec2e
          path: .lemon-smoke
          persist-credentials: false
      - name: Build and render the actual Lemon counter in the image
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/lemon-display"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/home/node/lemon \
            -v "$GITHUB_WORKSPACE/.lemon-smoke:/home/node/lemon" \
            -v "$GITHUB_WORKSPACE/apps/gateway/test-display.py:/usr/local/libexec/test-display.py:ro" \
            -v "$RUNNER_TEMP/lemon-display:/artifacts" \
            --entrypoint bash jian:ci -euo pipefail -c '
              cd "$HOME"
              cargo build --locked --example counter 2>&1 | tee /artifacts/build.log
              python3 /usr/local/libexec/test-display.py \
                --lemon "$HOME/target/debug/examples/counter" /artifacts \
                2>&1 | tee /artifacts/test.log
            '
      - name: Preserve Lemon render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemon-display
          path: ${{ runner.temp }}/lemon-display
          if-no-files-found: warn
  # This name remains the branch rule's single required check, even when every area is skipped.
  check:
    if: always()
    needs: [changes, node, triage, desktop, rust, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every selected gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success') throw new Error('Change detection failed.');
          const areas = { node: 'node', triage: 'triage', desktop: 'desktop', rust: 'rust', postgres: 'gateway' };
          for (const [job, area] of Object.entries(areas)) {
            const selected = jobs.changes.outputs[area];
            if (!['true', 'false'].includes(selected)) throw new Error(`Missing selection for ${area}.`);
            const accepted = selected === 'true' ? ['success'] : ['success', 'skipped'];
            if (!accepted.includes(jobs[job].result)) throw new Error(`${job}: ${jobs[job].result}`);
          }
          NODE
