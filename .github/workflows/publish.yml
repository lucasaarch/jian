name: Publish
# A release publishes the gateway and web images, the remote-control npm package and the desktop
# app, and nothing else does: a tag is the only commit anyone has said is worth running.
# `make release` pushes it, after its note in docs/releases is written; this workflow builds both
# architectures, publishes `@jian-ai/remote-control` at the same version, packages the desktop app
# for macOS, Windows and Linux at that version too, and publishes the GitHub release with that note
# and the app's installers and update files. The app and the gateway share a major.minor, so they
# always release together. `workflow_dispatch` stays for building an image by hand, and publishes
# no release, npm package or app.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions: {}
jobs:
  # Before anything is built, a tag without a valid note stops here.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the note of this version
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          retention-days: 1

  # One native runner per image and architecture. The repository is public, so the arm64
  # runner is free and emulation — which would make the Next.js build crawl — is never needed.
  # Each runner pushes the layers under a digest only; the index job names them. The web image
  # is the panel's server and always ships at the gateway's version: compose pairs them.
  build:
    needs: notes
    # A dispatch has no tag and no note to check, so a skipped check is not a failed one.
    if: ${{ !cancelled() && needs.notes.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, file: apps/gateway/Dockerfile, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { image: gateway, file: apps/gateway/Dockerfile, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { image: web, file: apps/web/Dockerfile, runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { image: web, file: apps/web/Dockerfile, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lucasaarch/jian-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JIAN_VERSION=${{ steps.meta.outputs.version }}
            JIAN_REVISION=${{ github.sha }}
          # Provenance is attested once over the index instead of once per architecture,
          # which also keeps the index free of the extra unknown/unknown manifests.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  index:
    needs: build
    strategy:
      matrix:
        image: [gateway, web]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/lucasaarch/jian-${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation and pushing it next to the image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Every tag is stated: `latest=auto` would also move latest on a dispatch.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A candidate such as v2.2.0-rc.1 publishes its own tag and nothing else, so an
            # installation that never named a version is never moved onto one.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Create the index
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: inspect
        name: Read the index digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  # Universal macOS computer-use helper, built from the Rust crate in packages/remote-core/native
  # for arm64 and x86_64 and dropped into the npm tarball.
  # Ad-hoc codesign by default. When Apple Developer secrets are set, the same job can
  # Developer ID–sign (see docs/remote.md); do not paste certificates into chat or logs.
  computer-helper:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal computer-helper
        working-directory: packages/remote-core
        run: |
          native/build-macos.sh
          test -x native/bin/macos/computer-helper
      - name: Optional Developer ID sign
        working-directory: packages/remote-core/native/bin/macos
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "${APPLE_DEVELOPER_ID_P12:-}" ] || [ -z "${APPLE_DEVELOPER_ID_P12_PASSWORD:-}" ]; then
            echo 'No Developer ID secrets; keeping ad-hoc signature from build-helper.sh.'
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/jian-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo 'Developer ID Application identity not found in the imported keychain.' >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --identifier com.jian.remote.computer-helper \
            computer-helper
          codesign --verify --verbose=2 computer-helper
          # Notarizing a bare helper is incomplete without signing Jian Remote.app; optional when API secrets exist.
          if [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER_ID:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
            ZIP="$RUNNER_TEMP/computer-helper.zip"
            ditto -c -k --keepParent computer-helper "$ZIP"
            xcrun notarytool submit "$ZIP" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
          else
            echo 'No App Store Connect API secrets; skipping notarytool for the helper.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: computer-helper
          path: packages/remote-core/native/bin/macos/computer-helper
          if-no-files-found: error
          retention-days: 1

  # Linux computer-use helpers, x64 and arm64: static musl binaries that run on any distro.
  computer-helper-linux:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux helpers
        working-directory: packages/remote-core
        run: |
          native/build-linux.sh
          test -x native/bin/linux/computer-helper-x64
          test -x native/bin/linux/computer-helper-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: computer-helper-linux
          path: packages/remote-core/native/bin/linux
          if-no-files-found: error
          retention-days: 1

  # Windows computer-use helpers, x64 and arm64, built with MSVC and the C runtime linked in.
  computer-helper-windows:
    needs: notes
    if: ${{ !cancelled() && needs.notes.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Build the Windows helpers
        working-directory: packages/remote-core
        run: |
          native/build-windows.sh
          test -f native/bin/windows/computer-helper-x64.exe
          test -f native/bin/windows/computer-helper-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: computer-helper-windows
          path: packages/remote-core/native/bin/windows
          if-no-files-found: error
          retention-days: 1

  # Same version as the gateway image / GitHub release. Requires repository secret NPM_TOKEN
  # (npm Automation / stage-only token with write on the @jian-ai scope). The job runs
  # `npm stage publish`; a maintainer then promotes the staged version on npmjs.com (2FA).
  # Image + GitHub release still publish if this job fails — fix the secret and re-run the
  # job, or cut the next tag.
  npm:
    needs: [notes, computer-helper, computer-helper-linux, computer-helper-windows]
    if: ${{ !cancelled() && needs.notes.result == 'success' && needs.computer-helper.result == 'success' && needs.computer-helper-linux.result == 'success' && needs.computer-helper-windows.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@jian-ai'
      # `npm stage publish` needs npm CLI 11.15.0+ (Node 22.14+). Actions' bundled npm may be older.
      - name: Install npm with stage publish
        run: npm install -g npm@^11.15.0
      - name: Stamp package version from the tag
        working-directory: apps/remote-control
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs');
            const version = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$version"
          node -e "console.log('Staging @jian-ai/remote-control@' + require('./package.json').version)"
      - uses: actions/download-artifact@v4
        with:
          name: computer-helper
          path: packages/remote-core/native/bin/macos
      - uses: actions/download-artifact@v4
        with:
          name: computer-helper-linux
          path: packages/remote-core/native/bin/linux
      - uses: actions/download-artifact@v4
        with:
          name: computer-helper-windows
          path: packages/remote-core/native/bin/windows
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --filter @jian-ai/remote-control...
      # One bundled file stamped with the version above, the helpers beside it in dist/.
      - name: Build the worker with the prebuilt computer-helper
        working-directory: apps/remote-control
        run: |
          chmod 755 ../../packages/remote-core/native/bin/macos/computer-helper
          chmod 755 ../../packages/remote-core/native/bin/linux/computer-helper-*
          pnpm run build
          test -x dist/macos/computer-helper
          test -x dist/linux/computer-helper-x64
          test -x dist/linux/computer-helper-arm64
          test -f dist/windows/computer-helper-x64.exe
          test -f dist/windows/computer-helper-arm64.exe
          grep -F "export const PACKAGE_VERSION = '${GITHUB_REF_NAME#v}';" dist/jian-remote.mjs
          npm pack --dry-run 2>&1 | grep -F 'dist/macos/computer-helper'
      - name: Require NPM_TOKEN
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo 'Missing repository secret NPM_TOKEN.'
            echo 'Create an npm Automation (stage-only) token with write on the @jian-ai scope,'
            echo 'add it as NPM_TOKEN, then re-run this job (or cut the next release tag).'
            exit 1
          fi
      - name: Stage @jian-ai/remote-control
        working-directory: apps/remote-control
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The desktop app, on one native runner per OS and CPU: the local gateway inside it installs its
  # native dependencies for the machine that packages it, so no CPU is cross-built. Each runner
  # takes its OS's Computer Use helper from the jobs above and the version from the tag, and leaves
  # its installers and update files for the release job, which uploads them to the tag's release.
  # macOS must be signed and notarized: Squirrel.Mac installs nothing else. Windows is signed only
  # when the optional WINDOWS_CSC_LINK secret is set.
  desktop:
    needs: [notes, computer-helper, computer-helper-linux, computer-helper-windows]
    if: ${{ !cancelled() && needs.notes.result == 'success' && needs.computer-helper.result == 'success' && needs.computer-helper-linux.result == 'success' && needs.computer-helper-windows.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: mac, arch: arm64, runner: macos-15, helper: computer-helper, helpers: macos }
          - { os: mac, arch: x64, runner: macos-15-intel, helper: computer-helper, helpers: macos }
          - { os: win, arch: x64, runner: windows-2025, helper: computer-helper-windows, helpers: windows }
          - { os: win, arch: arm64, runner: windows-11-arm, helper: computer-helper-windows, helpers: windows }
          - { os: linux, arch: x64, runner: ubuntu-24.04, helper: computer-helper-linux, helpers: linux }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, helper: computer-helper-linux, helpers: linux }
    runs-on: ${{ matrix.runner }}
    # Notarization waits on Apple, which is usually minutes and sometimes far more.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A runner of another CPU would package the local gateway's native code for the wrong one.
      - name: Check the runner's CPU
        run: test "$(node -p process.arch)" = '${{ matrix.arch }}'
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        working-directory: apps/desktop
        run: |
          node scripts/release-version.ts "$GITHUB_REF_NAME"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      # electron-builder writes it into the update files, where the app reads what a release brings.
      - name: Put the note in the update files
        run: cp "$RUNNER_TEMP/notes/notes.md" apps/desktop/build/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.helper }}
          path: packages/remote-core/native/bin/${{ matrix.helpers }}
      - name: Keep the helpers executable
        if: matrix.os != 'win'
        run: chmod 755 packages/remote-core/native/bin/${{ matrix.helpers }}/computer-helper*
      - name: Require the Apple signing secrets
        if: matrix.os == 'mac'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID \
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name: an unsigned or unnotarized Mac app cannot update."
              exit 1
            fi
          done
          # notarytool reads the App Store Connect key from a file.
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # The hook for a Windows code signing certificate: a base64 .pfx in WINDOWS_CSC_LINK and its
      # password in WINDOWS_CSC_KEY_PASSWORD. Without it the installer is unsigned, and SmartScreen
      # says "Windows protected your PC" with an unknown publisher until the owner runs it anyway.
      - name: Optional Windows signing
        if: matrix.os == 'win'
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if [ -z "${WINDOWS_CSC_LINK:-}" ]; then
            echo '::notice::No WINDOWS_CSC_LINK secret: the Windows installer is unsigned.'
            exit 0
          fi
          printf '%s' "$WINDOWS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/windows-signing.pfx"
          echo "WIN_CSC_LINK=$RUNNER_TEMP/windows-signing.pfx" >> "$GITHUB_ENV"
      - name: Package
        working-directory: apps/desktop
        env:
          # macOS: the Developer ID certificate, and the App Store Connect key that notarizes.
          CSC_LINK: ${{ matrix.os == 'mac' && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'mac' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'mac' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: |
          pnpm --filter @jian/contracts build
          pnpm --filter @jian/sdk build
          pnpm exec electron-vite build
          node scripts/stage-gateway.mjs
          pnpm exec electron-builder --publish never --${{ matrix.arch }}
      - name: Check what was packaged
        working-directory: apps/desktop/release
        run: |
          ls -la
          case '${{ matrix.os }}' in
            mac)
              test -f "Jian-$VERSION-mac-${{ matrix.arch }}.zip"
              test -f "Jian-$VERSION-mac-${{ matrix.arch }}.dmg"
              app="$(find . -maxdepth 2 -name Jian.app -type d | head -n 1)"
              codesign --verify --deep --strict --verbose=2 "$app"
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
              meta=latest-mac.yml
              ;;
            win)
              test -f "Jian-$VERSION-win-${{ matrix.arch }}.exe"
              meta=latest.yml
              ;;
            linux)
              ls "Jian-$VERSION-linux-"*.AppImage "Jian-$VERSION-linux-"*.deb
              meta=latest-linux.yml
              if [ '${{ matrix.arch }}' = arm64 ]; then meta=latest-linux-arm64.yml; fi
              ;;
          esac
          grep -Fx "version: $VERSION" "$meta"
          grep -q '^releaseNotes:' "$meta"
      # Each CPU's update file is a part: the release job merges one OS's two into the file it serves.
      - name: Collect the release files
        working-directory: apps/desktop/release
        run: |
          out="$RUNNER_TEMP/desktop"
          mkdir -p "$out"
          cp "Jian-$VERSION-"* "$out/"
          for meta in latest*.yml; do cp "$meta" "$out/$meta.${{ matrix.arch }}.part"; done
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop
          if-no-files-found: error
          retention-days: 1

  # The images are out by now; the release waits for the desktop app too, so its files are there
  # the moment installed apps can see it. A desktop build that failed leaves its OS without update
  # files on this release (installed apps there stay where they are); re-running the failed jobs
  # re-runs this one, which then adds them.
  release:
    needs: [notes, index, desktop]
    if: ${{ !cancelled() && needs.notes.result == 'success' && needs.index.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        if: needs.desktop.result != 'skipped'
        # A desktop build that failed entirely uploaded nothing; the merge says what is missing.
        continue-on-error: true
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Merge the update files of each OS
        run: |
          mkdir -p desktop
          node apps/desktop/scripts/update-metadata.ts desktop
          ls -la desktop
      - name: Publish the release with its note and the desktop app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if [[ "$TAG" != *-* ]]; then flags+=(--latest); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run: the note is written again, and files uploaded again replace their copies.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            # A draft until every file is up: no installed app reads a release half uploaded.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Jian ${TAG#v}" --notes-file notes.md
          fi
          if compgen -G 'desktop/*' > /dev/null; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber desktop/*
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
