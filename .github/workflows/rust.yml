name: Rust

on:
  push:
    paths:
      - 'crates/**'
      - 'bins/**'
      - 'packages/protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'deny.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bins/**'
      - 'packages/protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'deny.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # jian-store bundles Postgres: its build script lists and downloads the release from GitHub,
  # which rate limits anonymous callers (shared runner IPs hit it). The token only reads public data.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Checks that do not depend on the OS: formatting, docs, dependency rules, unused dependencies.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The TypeScript types are generated from the Rust ones; a stale copy, or a type that
      # disagrees with what serde writes (tsc over check.ts), fails here.
      - run: make protocol-check
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # Code behind cfg(target_os) compiles, lints and tests only on its own OS, so each runs here.
  # The Linux helper is pure Rust (x11rb), so no system packages are needed.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      # nextest does not run doctests, and starts the shared test Postgres (.config/nextest.toml).
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      # The Cloud edition runs only on Linux, so it is checked only there; macOS and Windows run the
      # self-hosted gateway alone. A plugin that exists only in the self-hosted edition must not
      # compile in the Cloud one; the fixture crate proves it (its doctest only runs in this build).
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-plugin-echo --no-default-features --features cloud --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p jian-plugin-echo --no-default-features --features cloud --locked
      # The gateway in the same edition: its test shows the self-hosted-only plugin gives no tool.
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-server --no-default-features --features cloud --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo nextest run -p jian-server --no-default-features --features cloud --locked -E 'binary(plugin_tools) | binary(mcp_tools) | binary(outbound) | (binary(gateway) & test(/mcp_servers/))'
      # The MCP plugin in the Cloud edition: no command (stdio) transport is compiled.
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-plugin-mcp --no-default-features --features cloud --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo nextest run -p jian-plugin-mcp --no-default-features --features cloud --locked
