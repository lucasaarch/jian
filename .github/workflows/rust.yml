name: Rust

on:
  push:
    paths:
      - 'crates/**'
      - 'bins/**'
      - 'apps/desktop-tauri/**'
      - 'packages/protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'deny.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.config/nextest.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bins/**'
      - 'apps/desktop-tauri/**'
      - 'packages/protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'deny.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.config/nextest.toml'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # jian-store bundles Postgres: its build script lists and downloads the release from GitHub,
  # which rate limits anonymous callers (shared runner IPs hit it). The token only reads public data.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Checks that do not depend on the OS: formatting, docs, dependency rules, unused dependencies.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile --filter @jian/desktop-tauri...
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The TypeScript types are generated from the Rust ones; a stale copy, or a type that
      # disagrees with what serde writes (tsc over check.ts), fails here.
      - run: make protocol-check
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # Code behind cfg(target_os) compiles, lints and tests only on its own OS, so each runs here.
  # The helper is pure Rust; the Tauri host needs WebKit2GTK on Linux, installed by each job below.
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile --filter @jian/desktop-tauri...
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # An edition is a sum of specific capabilities (`channels`, `mcp-stdio`, `multi-user`, etc.),
      # and the code tests those. macOS and Windows run only the gateway of the desktop app, the local
      # edition; the Cloud is Linux only, so it is checked only there. Linux checks all three.
      - name: clippy, self-hosted (the default build)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      # jian-browser's tests run the real engines. Obscura is a pinned release, checked against the
      # hash of its binary; Chrome is already on the Linux runner (found on PATH). A test whose
      # engine is missing says so and passes, so a runner without one cannot fail the build.
      - name: Obscura, for the browser tests
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/obscura" && cd "$RUNNER_TEMP/obscura"
          curl -fsSL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.7/obscura-x86_64-linux.tar.gz | tar xz
          echo "547f9d8a60048983f0e45c310f160d1239575af062af28e4f6755e361f8abcbf  obscura" | sha256sum -c -
          echo "JIAN_TEST_OBSCURA=$PWD/obscura" >> "$GITHUB_ENV"
          # Ubuntu 24.04 refuses Chrome's sandbox to a user without privileges; the runner is
          # a throwaway machine, so the restriction is lifted here and nowhere else.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ./obscura --help | head -3 || true
          for c in google-chrome chromium chromium-browser; do command -v $c && $c --version; done || true
      # nextest does not run doctests, and starts the shared test Postgres (.config/nextest.toml).
      - name: tests, self-hosted
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --locked
      - name: doctests, self-hosted
        if: runner.os == 'Linux'
        run: cargo test --doc --workspace --locked
      # Local: no public URL, so what needs one is not compiled; its tests prove it.
      - name: clippy, local
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features jian/local -- -D warnings
      - name: tests, local
        run: cargo nextest run --workspace --locked --no-default-features --features jian/local
      # Cloud: no local process (so no stdio plugin; the fixture crate proves it with a doctest that
      # only runs without the capability) and no private network for a plugin.
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-plugin-echo --no-default-features --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p jian-plugin-echo --no-default-features --locked
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-server --no-default-features --features cloud --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo nextest run -p jian-server --no-default-features --features cloud --locked -E 'binary(plugin_tools) | binary(mcp_tools) | binary(outbound) | (binary(gateway) & test(/mcp_servers|editions/))'
      - if: runner.os == 'Linux'
        run: cargo clippy -p jian-plugin-mcp --no-default-features --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo nextest run -p jian-plugin-mcp --no-default-features --locked
