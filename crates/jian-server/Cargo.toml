[package]
name = "jian-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Editions are sums of capabilities. Code tests a capability, never an edition; capabilities only
# add, so enabling two editions produces their union rather than a conflict.
local-process = ["jian-plugin-echo/local-process"]
mcp-http = ["jian-plugin-mcp/mcp-http"]
mcp-stdio = ["local-process", "jian-plugin-mcp/mcp-stdio"]
channels = ["dep:jian-channel-slack"]
public-artifacts = []
email-login = []
github-login = []
multi-user = []
email-invitations = ["multi-user"]
github-app = ["jian-plugin-api/webhook-routes", "jian-plugin-github/github-app"]
linear-webhooks = ["jian-plugin-api/webhook-routes", "jian-plugin-linear/webhooks"]
channel-webhooks = ["channels"]
slack-events-api = ["channels"]
multi-tenant = []
# Editions: the desktop app, a self-hosted gateway and the Cloud. The local build intentionally
# has no channels, extra users, public artifact links, or public webhook ingress.
default = ["self-hosted"]
local = ["mcp-http", "mcp-stdio"]
self-hosted = [
    "mcp-http",
    "mcp-stdio",
    "channels",
    "public-artifacts",
    "email-login",
    "github-login",
    "multi-user",
    "email-invitations",
    "github-app",
    "linear-webhooks",
    "channel-webhooks",
    "slack-events-api",
]
cloud = [
    "mcp-http",
    "channels",
    "public-artifacts",
    "email-login",
    "github-login",
    "multi-user",
    "email-invitations",
    "github-app",
    "linear-webhooks",
    "channel-webhooks",
    "slack-events-api",
    "multi-tenant",
]

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-browser.workspace = true
jian-core.workspace = true
jian-exec.workspace = true
getrandom.workspace = true
jian-llm.workspace = true
jian-mail.workspace = true
jian-plugin-api.workspace = true
jian-plugin-github.workspace = true
jian-channel-api.workspace = true
jian-channel-slack = { workspace = true, optional = true }
jian-plugin-linear.workspace = true
jian-plugin-mcp.workspace = true
jian-protocol.workspace = true
jian-runtime.workspace = true
jian-skills.workspace = true
jian-store.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
# A file is replaced only by a writer that names its mtime, a float of milliseconds that goes
# through JSON twice (worker, gateway, worker). Without exact float parsing it can come back one
# bit off and the worker then refuses the write as "changed".
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
jian-channel-api = { workspace = true, features = ["fake"] }
jian-channel-whatsapp.workspace = true
jian-plugin-echo.workspace = true
jian-remote.workspace = true
jian-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-tungstenite.workspace = true
whatsapp-rust.workspace = true

[lints]
workspace = true
