[package]
name = "jian-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-core.workspace = true
jian-exec.workspace = true
jian-llm.workspace = true
jian-mail.workspace = true
jian-protocol.workspace = true
jian-runtime.workspace = true
jian-skills.workspace = true
jian-store.workspace = true
serde.workspace = true
sha2.workspace = true
# A file is replaced only by a writer that names its mtime, a float of milliseconds that goes
# through JSON twice (worker, gateway, worker). Without exact float parsing it can come back one
# bit off and the worker then refuses the write as "changed".
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
jian-remote.workspace = true
jian-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
