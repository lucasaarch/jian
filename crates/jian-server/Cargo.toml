[package]
name = "jian-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The code tests a CAPABILITY, never an edition: `cfg(feature = "local-process")`, never
# `cfg(feature = "cloud")`. Capabilities only add, so turning on two editions at once is the sum of
# both and never a conflict. An edition is just a name for a sum, and `bins/jian` offers the same
# three.
#
# `local-process`: the gateway's machine is the owner's, so a plugin may run a program on it (MCP
#   over stdio, the test fixture's LocalEcho). Passed down to the plugin crates.
# `public-url`: the gateway can be reached from outside (a link in an e-mail or in a share, a
#   webhook). Without it the code that needs that does not compile; the desktop app has no URL.
# `multi-tenant`: what only the Cloud has, many tenants on one machine: an outbound request may
#   not reach a private network.
local-process = ["jian-plugin-echo/local-process", "jian-plugin-mcp/local-process"]
public-url = [
    "jian-plugin-api/public-url",
    "jian-plugin-github/public-url",
    "jian-plugin-linear/public-url",
]
multi-tenant = []
# The editions: the desktop app, a self-hosted gateway and the Cloud. The default is the
# self-hosted one, as `bins/jian`'s is.
default = ["self-hosted"]
local = ["local-process"]
self-hosted = ["local-process", "public-url"]
cloud = ["public-url", "multi-tenant"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-browser.workspace = true
jian-core.workspace = true
jian-exec.workspace = true
getrandom.workspace = true
jian-llm.workspace = true
jian-mail.workspace = true
jian-plugin-api.workspace = true
jian-plugin-github.workspace = true
jian-channel-api.workspace = true
jian-channel-slack.workspace = true
jian-plugin-linear.workspace = true
jian-plugin-mcp.workspace = true
jian-protocol.workspace = true
jian-runtime.workspace = true
jian-skills.workspace = true
jian-store.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
# A file is replaced only by a writer that names its mtime, a float of milliseconds that goes
# through JSON twice (worker, gateway, worker). Without exact float parsing it can come back one
# bit off and the worker then refuses the write as "changed".
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
jian-channel-api = { workspace = true, features = ["fake"] }
jian-channel-whatsapp.workspace = true
jian-plugin-echo.workspace = true
jian-remote.workspace = true
jian-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-tungstenite.workspace = true
whatsapp-rust.workspace = true

[lints]
workspace = true
