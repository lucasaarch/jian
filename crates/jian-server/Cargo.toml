[package]
name = "jian-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The default build is the self-hosted one, as `bins/jian`'s is. `cloud` is the build without what
# only a self-hosted install may do: a plugin that runs a local process, say. A plugin crate that
# exists in one edition only is wired here, behind that edition's feature, so the other build
# does not compile it. `cargo check -p jian-server --no-default-features --features cloud` must
# pass.
default = ["self-hosted"]
# The test fixture's self-hosted-only plugin comes with it, so the tests can show that a `cloud`
# build leaves it out.
self-hosted = ["jian-plugin-echo/self-hosted", "jian-plugin-mcp/self-hosted"]
cloud = []

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util.workspace = true
jian-auth.workspace = true
jian-core.workspace = true
jian-exec.workspace = true
jian-llm.workspace = true
jian-mail.workspace = true
jian-plugin-api.workspace = true
jian-plugin-mcp.workspace = true
jian-protocol.workspace = true
jian-runtime.workspace = true
jian-skills.workspace = true
jian-store.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
# A file is replaced only by a writer that names its mtime, a float of milliseconds that goes
# through JSON twice (worker, gateway, worker). Without exact float parsing it can come back one
# bit off and the worker then refuses the write as "changed".
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
jian-plugin-echo.workspace = true
jian-remote.workspace = true
jian-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
