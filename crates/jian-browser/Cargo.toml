[package]
name = "jian-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
jian-core.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

# The browser and its helpers are a process group: it is killed as one, and no zombie is left.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
