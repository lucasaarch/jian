[package]
name = "jian-plugin-github"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `public-url`: GitHub can reach the gateway, so the plugin answers its webhooks. Without it the
# plugin has no webhook and works from what people paste (app id, key, installation). A
# capability, never an edition.
public-url = ["jian-plugin-api/public-url"]

[dependencies]
base64.workspace = true
futures-util.workspace = true
jian-plugin-api.workspace = true
jiff.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
