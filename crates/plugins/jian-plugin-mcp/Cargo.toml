[package]
name = "jian-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Only the capability this crate hides code behind, never an edition. `local-process` is the
# stdio transport: a command an account names runs on the gateway's machine, which is the
# owner's in the local and self-hosted editions and ours in the Cloud, so the Cloud build has
# none. `cargo check -p jian-plugin-mcp --no-default-features` must pass and must not compile
# `stdio`. Capabilities only add, so two editions turned on together never conflict.
default = ["local-process"]
local-process = ["dep:tokio", "dep:rustix"]

# A stand-in MCP command for the stdio tests: speaks the protocol over its pipes, and can crash.
[[bin]]
name = "fake_stdio_server"
path = "tests/support/fake_stdio_server.rs"
test = false
required-features = ["local-process"]

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
jian-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# Only the command transport runs processes and timers.
tokio = { workspace = true, optional = true, features = ["io-util", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Stops a command server's whole process group.
rustix = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
