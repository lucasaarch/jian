[package]
name = "jian-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The default build is the self-hosted one, as `jian-server`'s is. `cloud` has no stdio
# transport: a command an account names would run on the operator's machine, and in the Cloud
# edition that machine is ours. `cargo check -p jian-plugin-mcp --no-default-features --features
# cloud` must pass and must not compile `stdio`.
default = ["self-hosted"]
self-hosted = ["dep:tokio", "dep:rustix"]
cloud = []

# A stand-in MCP command for the stdio tests: speaks the protocol over its pipes, and can crash.
[[bin]]
name = "fake_stdio_server"
path = "tests/support/fake_stdio_server.rs"
test = false
required-features = ["self-hosted"]

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
jian-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# Only the command transport runs processes and timers.
tokio = { workspace = true, optional = true, features = ["io-util", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Stops a command server's whole process group.
rustix = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
