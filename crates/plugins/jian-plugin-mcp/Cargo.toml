[package]
name = "jian-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
# The two transports can be selected independently.
default = ["mcp-http", "mcp-stdio"]
mcp-http = []
mcp-stdio = ["dep:tokio", "dep:rustix"]

# A stand-in MCP command for the stdio tests: speaks the protocol over its pipes, and can crash.
[[bin]]
name = "fake_stdio_server"
path = "tests/support/fake_stdio_server.rs"
test = false
required-features = ["mcp-stdio"]

[[test]]
name = "cloud"
path = "tests/cloud.rs"
required-features = ["mcp-http"]

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["mcp-http"]

[[test]]
name = "oauth"
path = "tests/oauth.rs"
required-features = ["mcp-http"]

[[test]]
name = "stdio"
path = "tests/stdio.rs"
required-features = ["mcp-stdio"]

[[test]]
name = "without_http"
path = "tests/without_http.rs"

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
jian-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# Only the command transport runs processes and timers.
tokio = { workspace = true, optional = true, features = ["io-util", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Stops a command server's whole process group.
rustix = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
