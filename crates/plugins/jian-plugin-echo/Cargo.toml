[package]
name = "jian-plugin-echo"
version.workspace = true
edition.workspace = true
license.workspace = true
# A fixture for tests, not a connector: no binary links it, and a crate lists it under
# `[dev-dependencies]` only.
publish = false

[features]
# Only the capability this crate hides code behind, never an edition: `local-process` is `LocalEcho`,
# which stands for a plugin that runs a process on the gateway's machine. The Cloud build leaves it
# out (`cargo test -p jian-plugin-echo --no-default-features` must pass and not compile it).
# Capabilities only add, so turning on two editions never conflicts.
default = ["local-process"]
local-process = []

[dependencies]
futures-util.workspace = true
jian-plugin-api.workspace = true
serde_json.workspace = true

[lints]
workspace = true
