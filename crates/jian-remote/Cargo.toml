[package]
name = "jian-remote"
version.workspace = true
edition.workspace = true
description = "Jian Remote's worker: keeps a machine connected to its gateway and runs what it is sent"
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
futures-util.workspace = true
globset.workspace = true
jian-protocol.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
serde.workspace = true
# A file is replaced only by a writer that names its mtime, a float of milliseconds that goes
# through JSON twice (worker, gateway, worker). Without exact float parsing it can come back one
# bit off and the worker then refuses the write as "changed".
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
url.workspace = true
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[lints]
workspace = true
