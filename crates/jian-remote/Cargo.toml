[package]
name = "jian-remote"
version.workspace = true
edition.workspace = true
description = "Jian Remote's worker: keeps a machine connected to its gateway and runs what it is sent"
license.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
globset = { version = "0.4", default-features = false }
jian-protocol = { path = "../jian-protocol" }
regex = "1.11"
# ring, not aws-lc: no cmake or Go to build it, and the same provider for both TLS clients.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5"
webpki-roots = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"
