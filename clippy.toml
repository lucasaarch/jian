# Tests state their expectations with unwrap, expect and panic; library code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Vendor names that docs spell as written.
doc-valid-idents = ["OpenAI", "OpenRouter", "ChatGPT", "SQLite", ".."]
